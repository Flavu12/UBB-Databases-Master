
name: Deploy PLAY Website

on:
  push:
    branches: [main]
    paths:
      - 'An II Sem I/Adaptive Web Design/**'
      - '.github/workflows/deploy-play.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload PLAY website
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'An II Sem I/Adaptive Web Design'

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
